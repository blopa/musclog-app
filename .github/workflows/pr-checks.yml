name: PR checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Tests, lint, and types
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint:eslint

      - name: Check types
        run: npm run typecheck

      # The same rules the test suite asserts; this step is here for the readable
      # report when a palette change fails.
      - name: Check palette
        run: npm run check-palette -- --quiet

# maybe enable these later, but not now
#      - name: Check release version sync
#        run: npm run check-version-sync
#
#      - name: Check translations
#        run: npm run check-translations
#
#      - name: Check locale consistency
#        run: npm run check-locale-consistency

      - name: Run tests
        run: npm run test:ci
