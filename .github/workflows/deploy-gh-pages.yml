name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering from the Actions tab

# One Pages deployment at a time. A newer push waits for the running one instead of cancelling it
# mid-sync, which would leave the site half published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'

      - name: Cache node_modules and Expo cache
        id: cache-npm
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            .expo
            /tmp/metro-*
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        env:
          NODE_ENV: production
        run: |
          npm run build-android-web
          touch dist/.nojekyll

      - name: Copy static images to dist
        run: |
          rm -rf dist/images dist/musclog-app/images
          mkdir -p dist/images dist/musclog-app/images
          cp -rL public/images/. dist/images/
          cp -rL public/musclog-app/images/. dist/musclog-app/images/

      # App Links / Universal Links ownership files. Copied explicitly: they sit in a dot-folder,
      # and the OS fetches them from exactly /.well-known/ with no redirect.
      - name: Copy app link verification files to dist
        run: |
          rm -rf dist/.well-known
          mkdir -p dist/.well-known
          cp -rL public/.well-known/. dist/.well-known/

      # include-hidden-files is required: since v4 the action drops every dot-entry by default,
      # which would silently remove /.well-known/ (app link verification) from the published site.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Backstop for a deployment that hangs: the action's own timeout below ends it first.
    timeout-minutes: 40
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Syncing ~2,000 files (the exercise photos are most of them) has run past the action's
      # 10 minute default, which cancels the deployment. Allow 30 minutes (milliseconds).
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
