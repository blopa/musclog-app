name: Build Android AAB

# Manual only: run it from Actions -> "Build Android AAB" -> Run workflow.
#
# This is `eas build --local` on a GitHub runner, so the build itself runs here and does not use
# EAS cloud build minutes. EAS is still used for the signing credentials (the managed upload key;
# android/app/build.gradle signs `release` with the debug key) and for the EAS environment
# variables of the `production` profile, which is why it needs EXPO_TOKEN.
#
# It builds, checks the signature and uploads the .aab as a run artifact. It never bumps the version.
#
# Google Play: only when "Also submit to Play internal testing" is ticked, and only to the INTERNAL
# track (the track is written in the step, not an input, so this workflow cannot reach production;
# promoting stays `scripts/release-android.sh promote`, run by hand). It goes through the same
# scripts/release-android.sh upload as a local release (preflight, versionCode above Play's).
on:
  workflow_dispatch:
    inputs:
      submit_to_internal:
        description: Also submit to Play internal testing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-android-aab
  cancel-in-progress: false

jobs:
  build:
    name: Production AAB
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check required secrets
        env:
          EXPO_TOKEN_SECRET: ${{ secrets.EXPO_TOKEN }}
          PLAY_SERVICE_ACCOUNT_JSON_SECRET: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$EXPO_TOKEN_SECRET" ]; then
            echo "::error::Add the repository secret EXPO_TOKEN (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          if [ "${{ inputs.submit_to_internal }}" = "true" ] && [ -z "$PLAY_SERVICE_ACCOUNT_JSON_SECRET" ]; then
            echo "::error::Submitting needs the repository secret PLAY_SERVICE_ACCOUNT_JSON (the Play service account key, whole JSON)."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A local build compiles three ABIs of the native code and needs several GB of scratch space.
      # The runner's image carries toolchains this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      # Match eas.json's build.base.node version so local builds behave like EAS cloud builds.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26.10.0'
          cache: npm
          cache-dependency-path: package-lock.json

      # Gradle 9.4.1 (SDK 58) supports Java 17 through 26.
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check release versions are in sync
        run: npm run check-version-sync

      - name: Read the app version
        id: version
        run: |
          name="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' android/app/build.gradle | head -1)"
          code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' android/app/build.gradle | head -1)"
          if [ -z "$name" ] || [ -z "$code" ]; then
            echo "::error::Could not read versionName/versionCode from android/app/build.gradle."
            exit 1
          fi
          echo "file=musclog-${name}-${code}.aab" >> "$GITHUB_OUTPUT"
          echo "Building ${name} (versionCode ${code})"

      # EAS environment variables with visibility "Secret" cannot be read by a local build (plain text
      # and sensitive ones are loaded from EAS). Pass SENTRY_AUTH_TOKEN directly to this step only.
      - name: Build the AAB with EAS (local)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_PROFILE: production
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          npx --no-install eas build \
            --platform android \
            --profile "$EAS_BUILD_PROFILE" \
            --local \
            --non-interactive \
            --output "$RUNNER_TEMP/out/${{ steps.version.outputs.file }}"

      # The same refusal scripts/release-android.sh makes: a bundle signed with the Android debug key
      # is never upload-ready.
      - name: Check the bundle is release-signed
        run: |
          aab="$RUNNER_TEMP/out/${{ steps.version.outputs.file }}"
          cert="$(keytool -printcert -jarfile "$aab" 2>&1)"
          owner="$(grep -m1 '^Owner:' <<<"$cert" || true)"
          if [ -z "$owner" ]; then
            echo "::error::$aab has no signing certificate."
            exit 1
          fi
          if grep -qiE 'CN=Android Debug|O=Android' <<<"$owner"; then
            echo "::error::$aab is signed with the Android DEBUG key."
            exit 1
          fi
          echo "$owner"
          ls -lh "$aab"

      - name: Upload the AAB
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.file }}
          path: ${{ runner.temp }}/out/${{ steps.version.outputs.file }}
          if-no-files-found: error
          retention-days: 14

      # gplay is pinned to the release the repo's scripts were written against; its installer checks the
      # release's SHA-256 before installing.
      - name: Install gplay
        if: inputs.submit_to_internal
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gplay-install.sh" \
            https://raw.githubusercontent.com/tamtom/play-console-cli/v1.0.2/install.sh
          GPLAY_VERSION=v1.0.2 bash "$RUNNER_TEMP/gplay-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sign in to Google Play
        if: inputs.submit_to_internal
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Submitting needs the repository secret PLAY_SERVICE_ACCOUNT_JSON (the Play service account key, whole JSON)."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/keys"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$HOME/keys/musclog-play-service-account.json"
          export PATH="$HOME/.local/bin:$PATH"
          gplay auth login --service-account "$HOME/keys/musclog-play-service-account.json" \
            --profile musclog --set-default=false >/dev/null

      - name: Submit to Play internal testing
        if: inputs.submit_to_internal
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          scripts/release-android.sh upload \
            --track internal \
            --skip-build \
            --file "$RUNNER_TEMP/out/${{ steps.version.outputs.file }}"

      - name: Remove the Play key
        if: always() && inputs.submit_to_internal
        run: rm -rf "$HOME/keys/musclog-play-service-account.json" "$HOME/.gplay"
