name: Feature request
description: Suggest an improvement or a new feature
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. The details below are pre-filled when you open this form from the app (Settings → Help & feedback). Nothing about you or your data is included automatically.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the moment this would help, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → bottom of the page
  - type: input
    id: platform
    attributes:
      label: Platform and OS version
      placeholder: Android 15, iOS 18, Web (Chrome)
  - type: input
    id: locale
    attributes:
      label: App language
      placeholder: en-US
