<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 905" width="100%" height="100%">
  <defs>
    <!-- Main background gradient (top-left green to bottom-right/top-right deep blue-teal) -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="90%" y2="85%">
      <stop offset="0%" stop-color="#3eb370" />
      <stop offset="45%" stop-color="#2e7d7b" />
      <stop offset="100%" stop-color="#295484" />
    </linearGradient>

    <!-- Subtle gradient for the light green wave -->
    <linearGradient id="green-wave" x1="30%" y1="100%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#4fb372" />
      <stop offset="100%" stop-color="#55b575" />
    </linearGradient>

    <!-- Metallic Frame Gradient (Deep Purple Titanium) -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5e4b5b" />
      <stop offset="25%" stop-color="#3d2e3b" />
      <stop offset="50%" stop-color="#2a1f28" />
      <stop offset="75%" stop-color="#4a3847" />
      <stop offset="100%" stop-color="#332631" />
    </linearGradient>

    <!-- Metallic Highlight Gradient -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.35" />
    </linearGradient>

    <!-- Side Button Gradient -->
    <linearGradient id="buttonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a1f28" />
      <stop offset="50%" stop-color="#5e4b5b" />
      <stop offset="100%" stop-color="#1f161e" />
    </linearGradient>

    <!-- Mask to cut out the screen area so it is 100% transparent -->
    <mask id="screenCutout">
      <rect x="280" y="60" width="440" height="880" fill="#ffffff" />
      <rect x="312" y="87" width="376" height="822" rx="49" fill="#000000" />
    </mask>
  </defs>

  <!-- 1. Base Gradient Rectangle -->
  <rect width="1920" height="905" fill="url(#bg-gradient)" />

  <!-- 2. Midground Light Green Wave -->
  <path d="M 637 852 
       C 750 680, 950 615, 1140 622 
       C 1320 628, 1420 530, 1560 380 
       C 1670 265, 1790 218, 1920 212 
       L 1920 600 
       L 637 852 Z" fill="url(#green-wave)" />

  <!-- 3. Foreground Dark Teal-Blue Wave -->
  <path d="M 590 905 
       C 620 865, 637 852, 660 835 
       C 780 755, 920 745, 1080 730 
       C 1240 715, 1340 630, 1460 560 
       C 1600 480, 1770 475, 1920 510 
       L 1920 905 
       Z" fill="#235069" />
  <!-- 4. Headline and feature list (layout matches the reference banner, scaled to 1920x905) -->
  <g font-family="Manrope, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" fill="#ffffff">
    <text font-size="67" font-weight="700" letter-spacing="1">
      <tspan x="678" y="312">TRACK YOUR WORKOUTS</tspan>
      <tspan x="678" y="385">&amp; NUTRITION LIKE A PRO</tspan>
    </text>
    <g font-size="31" font-weight="600" letter-spacing="0.5" fill-opacity="0.92">
      <text x="1046" y="460">• LOG REPS &amp; WEIGHTS</text>
      <text x="1046" y="502">• SEE YOUR PROGRESS</text>
      <text x="1046" y="544">• TRACK FOOD &amp; MACROS</text>
      <text x="1046" y="586">• STAY CONSISTENT</text>
    </g>
  </g>
  <!-- 5. Phone frame (assets/phoneframe.svg, 422x862 viewBox) placed at x=1575 y=140, 570 tall.
       The frame's screen is a transparent cutout, so a white screen sits behind it until a screenshot is dropped in. -->
  <g transform="translate(1383.90 95.70) scale(0.6613)">
    <rect x="312" y="87" width="376" height="822" rx="49" fill="#ffffff" />
  

    <!-- Left Side Buttons -->
    <rect x="289" y="210" width="6" height="32" rx="2.5" fill="url(#buttonGrad)" />
    <rect x="289" y="268" width="6" height="62" rx="2.5" fill="url(#buttonGrad)" />
    <rect x="289" y="346" width="6" height="62" rx="2.5" fill="url(#buttonGrad)" />

    <!-- Right Side Button -->
    <rect x="705" y="290" width="6" height="96" rx="2.5" fill="url(#buttonGrad)" />

    <!-- Phone Body & Bezel (Hollowed out via Mask) -->
    <g mask="url(#screenCutout)">
      <!-- Outer Metallic Chassis -->
      <rect x="293" y="68" width="414" height="860" rx="68" fill="url(#frameGrad)" stroke="#231922" stroke-width="1.5" />

      <!-- Metallic Inner Rim Highlight -->
      <rect x="296.5" y="71.5" width="407" height="853" rx="64.5" fill="none" stroke="url(#highlightGrad)" stroke-width="2" />

      <!-- Inner Black Screen Bezel -->
      <rect x="299" y="74" width="402" height="848" rx="62" fill="#121013" stroke="#000000" stroke-width="1.5" />
    </g>

    <!-- Inner Screen Rim Stroke -->
    <rect x="312" y="87" width="376" height="822" rx="49" fill="none" stroke="#000000" stroke-width="1" />
  </g>
</svg>