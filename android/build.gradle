// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    def kotlinVersion = findProperty('android.kotlinVersion')
    classpath(kotlinVersion ? "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion" : 'org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// @musclog native-build-job-pools
// Caps clang/ld parallelism per CMake project and drops debug info from
// release native code, so release builds fit the free EAS worker.
// Generated by plugins/withNativeBuildJobPools.js.
subprojects { subproject ->
  def heavyNative = ['shopify_react-native-skia'].contains(subproject.name)
  ['com.android.application', 'com.android.library'].each { pluginId ->
    subproject.plugins.withId(pluginId) {
      def cmake = subproject.android.defaultConfig.externalNativeBuild.cmake
      def compileJobs = heavyNative ? 1 : 2
      cmake.arguments(
        "-DCMAKE_JOB_POOLS=compile=${compileJobs};link=1",
        '-DCMAKE_JOB_POOL_COMPILE=compile',
        '-DCMAKE_JOB_POOL_LINK=link',
        '-DCMAKE_C_FLAGS_RELWITHDEBINFO=-O2 -g0 -DNDEBUG',
        '-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O2 -g0 -DNDEBUG'
      )
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
